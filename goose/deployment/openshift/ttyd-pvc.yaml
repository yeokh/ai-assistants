---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goose-ttyd-config
  labels:
    app: goose-ttyd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goose-ttyd-workspace
  labels:
    app: goose-ttyd
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
