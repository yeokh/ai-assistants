# OpenShift Secret for Goose ttyd web terminal API keys.
#
# Preferred: create with oc (avoids storing keys in YAML):
#
#   oc create secret generic goose-ttyd-api-keys \
#     --from-literal=GOOSE_PROVIDER=openai \
#     --from-literal=GOOSE_MODEL=gpt-4o \
#     --from-literal=OPENAI_API_KEY=sk-...
#
# Or Anthropic:
#   oc create secret generic goose-ttyd-api-keys \
#     --from-literal=GOOSE_PROVIDER=anthropic \
#     --from-literal=GOOSE_MODEL=claude-sonnet-4-5 \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#
# DO NOT commit real keys to git.
apiVersion: v1
kind: Secret
metadata:
  name: goose-ttyd-api-keys
  labels:
    app: goose-ttyd
type: Opaque
stringData:
  GOOSE_PROVIDER: openai
  GOOSE_MODEL: gpt-4o
  OPENAI_API_KEY: "<your-openai-api-key>"
  # ANTHROPIC_API_KEY: ""
  # OPENROUTER_API_KEY: ""
  # GOOGLE_API_KEY: ""
