# OpenShift Secret for OpenCode Web UI server auth + LLM API keys.
#
# Preferred: create with oc (avoids storing keys in YAML):
#
#   oc create secret generic opencode-web-secrets \
#     --from-literal=OPENCODE_SERVER_PASSWORD='changeme' \
#     --from-literal=OPENCODE_SERVER_USERNAME=opencode \
#     --from-literal=OPENCODE_MODEL=openai/gpt-4o \
#     --from-literal=OPENAI_API_KEY=sk-...
#
# Or Anthropic:
#   oc create secret generic opencode-web-secrets \
#     --from-literal=OPENCODE_SERVER_PASSWORD='changeme' \
#     --from-literal=OPENCODE_MODEL=anthropic/claude-sonnet-4-5 \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#
# DO NOT commit real keys or passwords to git.
apiVersion: v1
kind: Secret
metadata:
  name: opencode-web-secrets
  labels:
    app: opencode-web
type: Opaque
stringData:
  OPENCODE_SERVER_PASSWORD: "<your-opencode-server-password>"
  OPENCODE_SERVER_USERNAME: "opencode"
  OPENCODE_MODEL: "openai/gpt-4o"
  OPENAI_API_KEY: "<your-openai-api-key>"
  # ANTHROPIC_API_KEY: ""
  # OPENROUTER_API_KEY: ""
  # GOOGLE_API_KEY: ""
