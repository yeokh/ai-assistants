---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-web-config
  labels:
    app: opencode-web
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-web-workspace
  labels:
    app: opencode-web
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
